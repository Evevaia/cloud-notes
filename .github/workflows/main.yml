name: Update UTC Time

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Write UTC time
        run: |
          echo $(date -u '+%Y-%m-%d %H:%M UTC') > time.txt
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add time.txt
          git commit -m "update time" || exit 0
          git push
